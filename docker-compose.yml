
services:
  postgres:
    image: postgres:17
    container_name: distributed-wallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: distributed_wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d distributed_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: distributed-wallet:latest
    container_name: distributed-wallet-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: distributed_wallet
      DATABASE_USER: wallet
      DATABASE_PASSWORD: wallet
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  localstack_data:
